<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Hub | Contact Me</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary-orange: #ff4a00;
            --ff-yellow: #ffb703;
            --text-light: #ffffff;
            --text-muted: #c5a880;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.95)), url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920') no-repeat center center/cover;
        }

        /* ==========================================
           ⏳ LOADING SCREEN
        ========================================== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050608;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-logo {
            font-size: 3rem;
            font-weight: 900;
            color: white;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            animation: pulseGlow 1.5s infinite alternate;
        }

        .loader-logo span { color: var(--primary-orange); }

        .progress-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--primary-orange), var(--ff-yellow));
            box-shadow: 0 0 15px var(--primary-orange);
            transition: width 0.1s linear;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(255, 74, 0, 0.2); }
            100% { text-shadow: 0 0 25px rgba(255, 74, 0, 0.8); }
        }

        .hidden-content {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .show-content { opacity: 1; transform: translateY(0); }

        /* ==========================================
           CONTACT PAGE LAYOUT
        ========================================== */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(11, 12, 16, 0.95);
            border-bottom: 2px solid var(--primary-orange);
            width: 100%;
        }

        nav .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; color: var(--primary-orange); }
        nav ul { display: flex; list-style: none; }
        nav ul li a { color: var(--text-light); text-decoration: none; font-weight: 600; text-transform: uppercase; }

        .contact-container {
            max-width: 600px;
            width: 90%;
            margin: 60px auto;
            background-color: rgba(31, 40, 51, 0.9);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid rgba(255, 74, 0, 0.3);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
        }

        .contact-container h2 { text-transform: uppercase; font-size: 2rem; color: var(--ff-yellow); margin-bottom: 10px; text-align: center; }
        .contact-container p { color: var(--text-muted); text-align: center; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background-color: #0b0c10; border: 1px solid #455a64; color: white; border-radius: 4px;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-orange); box-shadow: 0 0 8px rgba(255, 74, 0, 0.5); }

        .submit-btn {
            width: 100%; padding: 14px; background-color: var(--primary-orange); color: white; border: none; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background-color: var(--ff-yellow); color: black; box-shadow: 0 0 20px var(--ff-yellow); }

        footer { text-align: center; padding: 20px; background-color: #050608; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--card-bg); }
    </style>
</head>
<body>

    <!-- ⏳ LOADING SCREEN SCREEN -->
    <div id="loading-screen">
        <div class="loader-logo">FREE<span>FIRE</span></div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Decrypting Comms... 0%</div>
    </div>

    <!-- MAIN CONTENT WRAPPER -->
    <div id="main-content" class="hidden-content" style="display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; width: 100%;">
        <nav>
            <div class="logo">YOUR_NAME FF</div>
            <ul>
                <li><a href="index.html">← Back To Home</a></li>
            </ul>
        </nav>

        <div class="contact-container">
            <h2>Squad Recruitment</h2>
            <p>Looking to invite me to a clan, sponsor me, or collaborate? Send a transmission.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">In-Game Name / Real Name</label>
                    <input type="text" id="name" placeholder="e.g., VeloCity_FF" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Purpose / Subject</label>
                    <input type="text" id="subject" placeholder="Clan Invite, Sponsorship" required>
                </div>
                <div class="form-group">
                    <label for="message">Mission Details / Message</label>
                    <textarea id="message" rows="5" placeholder="Drop your details here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <footer>
            <p>Secured Guild System Connection • Free Fire Theme Portfolio</p>
        </footer>
    </div>

    <!-- 📜 JAVASCRIPT CONTROLLER -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const loadingText = document.getElementById('loading-text');
            const loadingScreen = document.getElementById('loading-screen');
            const mainContent = document.getElementById('main-content');
            
            let progress = 0;
            
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 20) + 10; // Slightly faster for the contact page
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        loadingScreen.style.visibility = 'hidden';
                        mainContent.classList.add('show-content');
                    }, 300);
                }
                progressBar.style.width = progress + '%';
                loadingText.innerText = `Establishing Secure Link... ${progress}%`;
            }, 80);
        });
    </script>
</body>
</html>
